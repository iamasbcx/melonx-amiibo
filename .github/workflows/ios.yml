name: Build unsigned MeloNX Amiibo

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ios-unsigned:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Select fixed Xcode
        shell: bash
        run: |
          test -d /Applications/Xcode_26.2.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_26.2.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Build NativeAOT and unsigned app
        shell: bash
        run: bash scripts/build-ios-unsigned.sh
      - name: Upload build artifacts and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MeloNXAmiibo-unsigned-${{ github.run_number }}
          path: |
            build/artifacts/
            build/logs/
          if-no-files-found: error
          retention-days: 14
